[project]
name = "radar-veille-ia"
version = "1.0.0"
description = "Radar d'innovation automatisé : détection des ruptures technologiques en IA"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.11", "pyyaml>=6.0", "requests>=2.32"]

[project.optional-dependencies]
clusters = ["scikit-learn>=1.5"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
